name: Daily platform summary

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-summary:
    name: Email daily administrator summary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send daily summary
        run: node scripts/send-daily-summary.mjs
        env:
          DAILY_SUMMARY_SECRET: ${{ secrets.DAILY_SUMMARY_SECRET }}
